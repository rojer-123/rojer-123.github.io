<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>售后维修手册导航</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#0a1929;color:#e8f0f7;padding:20px}
.wrap{width:100%;max-width:560px}
h1{font-size:22px;text-align:center;margin-bottom:6px}
.sub{text-align:center;font-size:12px;letter-spacing:2px;color:#7d95ab;margin-bottom:32px}
a.card{display:flex;align-items:center;gap:16px;padding:20px;border-radius:14px;background:#12263c;border:1px solid #1f3a57;text-decoration:none;color:inherit;margin-bottom:14px;transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-2px);border-color:#1677ff}
.icon{width:46px;height:46px;border-radius:11px;background:linear-gradient(135deg,#1677ff,#26c6da);display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.card h2{font-size:16px;margin-bottom:4px}
.card p{font-size:12px;color:#8ba3b9}
</style>
</head>
<body>
<div class="wrap">
  <h1>售后维修手册导航</h1>
  <div class="sub">SERVICE MANUAL PORTAL</div>
  <a class="card" href="g3-manual/">
    <div class="icon">G3</div>
    <div><h2>G3 荷兰版维修手册</h2><p>G3 Manual (NL) · 含爆炸图交互查看</p></div>
  </a>
  <a class="card" href="zt3proii-max-manual/">
    <div class="icon">ZT3</div>
    <div><h2>ZT3 Pro II &amp; MAX 维修与故障诊断手册</h2><p>整合版 · 手机端适配</p></div>
  </a>
</div>
</body>
</html>
